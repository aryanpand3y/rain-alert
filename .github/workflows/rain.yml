name: Rain alert

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:          # lets you run it manually to test

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for rain
        run: python rain_alert.py
        env:
          LAT: ${{ secrets.LAT }}
          LON: ${{ secrets.LON }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Save state (so you get one alert per rain, not every 10 min)
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "rain-bot"
            git config user.email "rain-bot@users.noreply.github.com"
            git add state.json
            git commit -m "update rain state"
            git push
          fi
